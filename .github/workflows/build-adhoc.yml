name: Build signed IPA (Ad Hoc)

# Manual only. Needs three repository secrets:
#   BUILD_CERTIFICATE_BASE64  Apple Distribution certificate + private key (.p12), base64
#   P12_PASSWORD              password of that .p12
#   ADHOC_PROFILE_BASE64      Ad Hoc provisioning profile (.mobileprovision), base64, with NFC Tag Reading
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adhoc:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        variant:
          # NDEF application AID: a Type 4 tag answers SELECT, so iOS reports it as ISO 7816 (APDU path).
          - name: ndef-aid
            aid: D2760000850101
          # Proprietary placeholder AID that should not match: an ISO 14443-A tag may then be
          # reported as MIFARE, where the raw-frame path (sendMiFareCommand) can be tried.
          - name: no-aid
            aid: F0000000000001
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE: ${{ secrets.ADHOC_PROFILE_BASE64 }}
        run: |
          missing=""
          [ -n "$P12" ] || missing="$missing BUILD_CERTIFICATE_BASE64"
          [ -n "$P12_PASSWORD" ] || missing="$missing P12_PASSWORD"
          [ -n "$PROFILE" ] || missing="$missing ADHOC_PROFILE_BASE64"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Install certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          ADHOC_PROFILE_BASE64: ${{ secrets.ADHOC_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo -n "$ADHOC_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/adhoc.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Apple WWDR G3 intermediate: the Apple Distribution certificate chains to it, and
          # without it in the keychain the identity does not validate. Pinned by SHA-256.
          curl -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          WWDR_FP=$(openssl x509 -inform DER -in "$RUNNER_TEMP/AppleWWDRCAG3.cer" -noout -fingerprint -sha256 | cut -d= -f2)
          [ "$WWDR_FP" = "DC:F2:18:78:C7:7F:41:98:E4:B4:61:4F:03:D6:96:D8:9C:66:C6:60:08:D4:24:4E:1B:99:16:1A:AC:91:60:1F" ] \
            || { echo "::error::Unexpected WWDR G3 fingerprint: $WWDR_FP"; exit 1; }
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q '1 valid identities found' \
            || { echo "::error::The distribution identity does not validate on this runner"; exit 1; }

          security cms -D -i "$RUNNER_TEMP/adhoc.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/adhoc.mobileprovision" "$dir/$PROFILE_UUID.mobileprovision"
          done
          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "PROFILE_NAME=$PROFILE_NAME"
            echo "TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"

          # Profile facts, without device identifiers (the repository is public).
          echo "Profile: $PROFILE_NAME, team $TEAM_ID"
          echo "Devices in profile: $(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" | grep -c -E '^[[:space:]]+[0-9A-Fa-f-]{20,}$' || true)"
          /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.nfc.readersession.formats' "$RUNNER_TEMP/profile.plist" \
            || { echo "::error::The profile has no NFC Tag Reading entitlement. Enable it on the App ID, then regenerate and download the profile."; exit 1; }

      - name: Set ISO 7816 AID for this variant
        run: |
          /usr/libexec/PlistBuddy -c "Set :com.apple.developer.nfc.readersession.iso7816.select-identifiers:0 ${{ matrix.variant.aid }}" App/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.nfc.readersession.iso7816.select-identifiers' App/Info.plist

      - name: Archive (Release, signed)
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild \
            -project PengPengHeartbeat.xcodeproj \
            -scheme PengPengHeartbeat \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PengPeng.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
            archive

      - name: Export Ad Hoc IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>release-testing</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.kalijerry.pengpengheartbeat</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>thinning</key><string>&lt;none&gt;</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PengPeng.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          test -n "$IPA"
          cp "$IPA" "PengPengHeartbeat-adhoc-${{ matrix.variant.name }}.ipa"

      - name: Verify NFC entitlement and AID in the signed app
        run: |
          set -euo pipefail
          CHECK="$RUNNER_TEMP/check"
          rm -rf "$CHECK" && mkdir -p "$CHECK"
          unzip -q "PengPengHeartbeat-adhoc-${{ matrix.variant.name }}.ipa" -d "$CHECK"
          APP=$(find "$CHECK/Payload" -maxdepth 1 -name '*.app' | head -1)
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null
          grep -q 'com.apple.developer.nfc.readersession.formats' "$RUNNER_TEMP/entitlements.plist" \
            || { echo "::error::The signed app has no NFC entitlement"; exit 1; }
          echo "NFC entitlement present"
          /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.nfc.readersession.iso7816.select-identifiers' "$APP/Info.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: PengPengHeartbeat-adhoc-${{ matrix.variant.name }}
          path: PengPengHeartbeat-adhoc-${{ matrix.variant.name }}.ipa

      - name: Remove temporary keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi
          rm -f "$RUNNER_TEMP/adhoc.mobileprovision" "$RUNNER_TEMP/profile.plist"
